<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title2 desc2">
  <title id="title2">配置文件片段示意</title>
  <desc id="desc2">nginx.conf 中 upstream 与 location 块的示意排版</desc>
  <rect width="640" height="320" fill="#1b1b1d" />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e8e8e8">
    <text x="24" y="40">upstream backend {</text>
    <text x="48" y="66">server 10.0.0.11:8080;</text>
    <text x="48" y="92">server 10.0.0.12:8080;</text>
    <text x="24" y="118">}</text>
    <text x="24" y="160">server {</text>
    <text x="48" y="186">listen 443 ssl;</text>
    <text x="48" y="212">location / {</text>
    <text x="72" y="238">proxy_pass http://backend;</text>
    <text x="48" y="264">}</text>
    <text x="24" y="290">}</text>
  </g>
</svg>
