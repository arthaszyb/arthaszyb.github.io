<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">请求流向示意图</title>
  <desc id="desc">客户端经 Nginx 反向代理分发到两个上游应用服务器的示意图</desc>
  <rect width="640" height="220" fill="#f7f7f7" />
  <g font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#1a1a1a">
    <rect x="20" y="90" width="120" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="80" y="120" text-anchor="middle">Client</text>

    <line x1="140" y1="115" x2="250" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="250" y="90" width="140" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="320" y="120" text-anchor="middle">Nginx</text>

    <line x1="390" y1="105" x2="480" y2="60" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="390" y1="125" x2="480" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="480" y="35" width="140" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="550" y="65" text-anchor="middle">App Server A</text>

    <rect x="480" y="145" width="140" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="550" y="175" text-anchor="middle">App Server B</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a" />
    </marker>
  </defs>
</svg>
